services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode, no ZooKeeper). Two client listeners, like Redpanda:
  #   INTERNAL  kafka:9092                             -> containers on this network
  #   EXTERNAL  meowmetry-kafka.dev1.mnt.group:29092   -> clients outside the network
  #
  # The EXTERNAL listener binds :9094 in the container and is published on host
  # port 29092 (9092 is taken by Redpanda on this host). It advertises the public
  # hostname so that a client bootstrapping from outside gets handed an address it
  # can reach again (the advertised-listener dance). Reach it directly with a
  # native Kafka client — no Caddy, since the broker protocol is raw TCP, not HTTP.
  #   python kafka_consumer.py meowmetry-kafka.dev1.mnt.group:29092
  # DNS for the hostname must resolve to this host, with TCP :29092 open.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "29092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://meowmetry-kafka.dev1.mnt.group:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 12

        # Web UI to eyeball topics/messages: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: meowmetry
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      default:


        # ---------------------------------------------------------------------------
        # The signal generator itself.
        #   http://localhost:4000  -> dashboard + long-poll + SSE + WebSocket
        #   localhost:50051        -> gRPC
        # ---------------------------------------------------------------------------

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    restart: unless-stopped
    command: [ "--retentionPeriod=1d" ]
    ports:
      - "8428:8428"
    networks:
      default:


        # Tempo stores traces; the bridge pushes them in over OTLP (gRPC 4317 / HTTP 4318).
  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200" # Tempo query API (Grafana datasource)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      default:


  # ---------------------------------------------------------------------------
  # OTLP bridges. Each reads one signal stream from the app (in-network at
  # app:4000) and pushes it to its OTLP-native store — no collector, no scrape.
  # They run automatically on `docker compose up`, installing their Python deps
  # from clients/requirements.txt on start. Both retry/reconnect on their own,
  # so they tolerate the app or store not being ready yet.
  #
  #   metrics (WS)   -> otel_metrics_bridge.py -- OTLP push --> VictoriaMetrics
  #   trace   (poll) -> tempo_bridge.py        -- OTLP push --> Tempo
  # ---------------------------------------------------------------------------
  tempo-bridge:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /clients
    volumes:
      - ./clients:/clients:ro
    command:
      - bash
      - -lc
      - "pip install -q -r requirements.txt &&
         python tempo_bridge.py http://app:4000/api/poll http://tempo:4318"
    depends_on:
      - tempo
    networks:
      default:

  metrics-bridge:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /clients
    volumes:
      - ./clients:/clients:ro
    command:
      - bash
      - -lc
      - "pip install -q -r requirements.txt &&
         python otel_metrics_bridge.py ws://app:4000/ws http://victoriametrics:8428/opentelemetry"
    depends_on:
      - victoriametrics
    networks:
      default:

        # Pre-wired with VictoriaMetrics + Tempo datasources and starter dashboards.
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # First admin user, created on first boot. Change the password!
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "dondon"
      # Real login: show the form, no anonymous access, no open sign-up.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlMetrics"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics
      - tempo
    networks:
      default:


volumes:
  grafana-data:
